<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `loadFile` gives the document an opaque origin, so `'self'` alone matches
      nothing and both the stylesheet and the module script are blocked — the
      window renders blank in the packaged app. `file:` is what actually
      matches; ws:/localhost keep electron-vite's HMR client working in dev,
      which also needs inline styles.
    -->
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: mediastream: blob:; connect-src 'self' ws: http://localhost:*" />
    <title>Choose what to share</title>
    <link rel="stylesheet" href="./picker.css" />
  </head>
  <body>
    <header>
      <h1>Choose what to share</h1>
      <p id="audio-note" hidden>System audio will be included</p>
    </header>
    <nav role="tablist">
      <button id="tab-screen" role="tab" type="button" aria-selected="true">Screens</button>
      <button id="tab-window" role="tab" type="button" aria-selected="false">Windows</button>
    </nav>
    <ul id="grid" role="listbox" aria-label="Capture sources"></ul>
    <footer>
      <span class="hint">↑↓ move · Enter share · Esc cancel</span>
      <button id="cancel" type="button">Cancel</button>
    </footer>
    <script type="module" src="./picker.ts"></script>
  </body>
</html>
