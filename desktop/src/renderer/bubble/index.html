<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `loadFile` gives the document an opaque origin, so `'self'` alone matches
      nothing and both the stylesheet and the module script are blocked — the
      window renders blank in the packaged app. `file:` is what actually
      matches; ws:/localhost keep electron-vite's HMR client working in dev,
      which also needs inline styles.
    -->
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: mediastream: blob:; connect-src 'self' ws: http://localhost:*" />
    <title>Yoom camera</title>
    <link rel="stylesheet" href="./bubble.css" />
  </head>
  <body>
    <!-- The whole body is the drag region; only the control strip opts out. -->
    <div id="shell">
      <div id="shape">
        <video id="cam" autoplay muted playsinline></video>
        <p id="fallback">No camera</p>
      </div>
      <div id="controls">
        <button id="cycle" type="button" title="Change shape" aria-label="Change shape">
          ◑
        </button>
        <button id="hide" type="button" title="Hide bubble" aria-label="Hide bubble">
          ✕
        </button>
      </div>
    </div>
    <script type="module" src="./bubble.ts"></script>
  </body>
</html>
